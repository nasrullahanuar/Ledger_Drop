<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger Drop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 1. Start page -->
<section class="screen show hero" id="sStart">
  <div class="brand big"><span class="logo">$</span></div>
  <h1 class="title">Ledger Drop</h1>
  <p class="tag">Drop, merge and balance the books.<br>Build the Audit trophy within 10 minutes.</p>
  <div class="floaters" id="floaters">
    <canvas width="60" height="60" style="--d:0"></canvas><canvas width="60" height="60" style="--d:1"></canvas><canvas width="60" height="60" style="--d:2"></canvas>
    <canvas width="60" height="60" style="--d:3"></canvas><canvas width="60" height="60" style="--d:4"></canvas><canvas width="60" height="60" style="--d:5"></canvas>
  </div>
  <button class="btn big" id="playBtn">Play</button>
  <button class="btn ghost" id="helpBtn0">How to play</button>
</section>

<!-- 2. Player name -->
<section class="screen" id="sSetup">
  <div class="sheet setup">
    <h2>Who is playing?</h2>
    <label>Your name
      <span class="nm"><input id="n1" maxlength="12" placeholder="Enter your name" autocomplete="off"><button class="chip" data-g="n1" data-v="Guest">Guest</button></span>
    </label>
    <p class="note">Your best score is saved on this device. Tap Guest to play without a name.</p>
    <div class="row"><button class="btn" id="goBtn">Start game</button><button class="link" id="backBtn">Back</button><button class="link" id="helpBtn1">How to play</button></div>
  </div>
</section>

<!-- 3. Game -->
<main class="screen app" id="sGame">
  <div class="top">
    <button class="small" id="menuBtn">Menu</button>
    <div class="stat" id="timeBox"><small>Time</small><b id="time">10:00</b></div>
    <button class="small" id="helpBtn">? Help</button>
    <button class="small" id="muteBtn" aria-label="Toggle sound">Sound: on</button>
  </div>
  <section class="board" id="board">
    <div class="frame">
      <div class="wrap" id="wrap">
        <canvas class="cv" id="cv"></canvas>
        <div class="pick" id="pick"></div>
        <div class="toast" id="toast"></div>
      </div>
    </div>
    <aside class="side">
      <div class="bhead">
        <div class="who"><b id="who">Guest</b><small id="best">Best: 0</small></div>
        <div class="stat"><small>Score</small><b id="score">0</b></div>
        <div class="next"><canvas id="next" width="72" height="72"></canvas></div>
      </div>
      <div class="pw" id="pw">
        <button class="small" data-p="elim" title="Tap an item to delete it (key 1)"><em>&#10005;</em> Remove <i></i></button>
        <button class="small" data-p="up" title="Tap an item to evolve it (key 2)"><em>&#8679;</em> Upgrade <i></i></button>
        <button class="small" data-p="bomb" title="Tap a spot to blast nearby items (key 3)"><em>&#10041;</em> Bomb <i></i></button>
        <button class="small" data-p="pick" title="Choose your next item (key 4)"><em>&#9733;</em> Pick <i></i></button>
        <button class="small" data-p="shake" title="Rattle the box (key 5)"><em>&#8779;</em> Shake <i></i></button>
        <button class="small" data-p="time" title="Add 30 seconds (key 6)"><em>+</em> 30 sec <i></i></button>
      </div>
      <div class="legend" id="legend"></div>
    </aside>
  </section>
</main>

<div class="overlay fixed" id="result"></div>
<div class="overlay fixed" id="guide" role="dialog" aria-label="How to play">
  <div class="sheet guide">
    <h2 id="gtitle"></h2>
    <div id="gbody"></div>
    <div class="dots" id="gdots"></div>
    <div class="row"><button class="link" id="gPrev">Back</button><button class="btn" id="gNext">Next</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="items.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
